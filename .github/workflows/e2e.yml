name: KBE E2E Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Java & Maven einrichten (Quarkus Backend)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js einrichten (Frontend & Cypress)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Quarkus Backend im Hintergrund starten
        run: |
          mvn quarkus:dev &
          echo "Warte auf Quarkus Backend..."
          # Bis zu 60 Sekunden warten, bis Port 8080 antwortet
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/todos; then
              echo "Backend ist erreichbar!"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: Backend ist nicht rechtzeitig gestartet."
          exit 1

      - name: Frontend Dependencies installieren
        working-directory: ./frontend
        run: npm ci

      - name: Cypress E2E Tests im Headless Modus ausführen
        working-directory: ./frontend
        run: npx cypress run --browser electron