name: KBE E2E Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Java & Maven einrichten (Quarkus Backend)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js einrichten (Frontend & Cypress)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Frontend Dependencies installieren
        working-directory: ./frontend
        run: npm ci

      - name: Quarkus Backend im Hintergrund starten
        run: |
          # Startet Maven/Quarkus im Hintergrund
          mvn quarkus:dev &
          echo "Warte auf Quarkus Backend (Port 8080)..."
          for i in {1..40}; do
            if curl -s http://127.0.0.1:8080/api/todos; then
              echo "Backend ist erreichbar!"
              exit 0
            fi
            sleep 3
          done
          echo "Timeout: Backend ist nicht rechtzeitig gestartet."
          exit 1

      - name: Vue 3 Frontend im Hintergrund starten
        working-directory: ./frontend
        run: |
          # Startet den Vite Dev-Server im Hintergrund
          npm run dev -- --host 127.0.0.1 &
          echo "Warte auf Frontend (Port 5173)..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5173; then
              echo "Frontend ist erreichbar!"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: Frontend ist nicht rechtzeitig gestartet."
          exit 1

      - name: Cypress E2E Tests im Headless Modus ausführen
        working-directory: ./frontend
        run: npx cypress run --browser electron